# /etc/nginx/sites-available/as-prescribed (linked from sites-enabled)
# Port 80 only as committed; certbot --nginx adds the 443 server and the redirect on the machine.
# No access log: nothing about a session is logged (CLAUDE.md, adr.ap.004).
server {
    listen 80;
    listen [::]:80;
    server_name asprescribed.sunrisesoftware.app;

    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A run is a server-sent event stream: no buffering, and a live replay lasts minutes
        # (the app sends a keep-alive every 15 s).
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
