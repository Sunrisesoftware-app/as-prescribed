<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home exercise program</title>
<style>
  /* The patient's sheet: large type, the patient's language first, printable. The program travels in the
     URL fragment, which the browser never sends to the server. */
  :root { --ink: #111a16; --muted: #56645e; --line: #cfd8d3; --accent: #0d6b62; --bg: #ffffff;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", "Geeza Pro", Tahoma, sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e6ede9; --muted: #9aa8a1; --line: #2c3833; --accent: #5bbcaf; --bg: #111715; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.6 var(--sans); }
  .sheet { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  header { border-bottom: 2px solid var(--accent); padding-bottom: 12px; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 28px; line-height: 1.3; }
  .sub { color: var(--muted); font-size: 15px; }
  ol { margin: 0; padding: 0; list-style: none; counter-reset: ex; display: grid; gap: 14px; }
  li { counter-increment: ex; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; }
  li .text { font-size: 21px; line-height: 1.75; }
  li .text::before { content: counter(ex) ". "; font-weight: 700; color: var(--accent); }
  li .en { font-size: 14px; color: var(--muted); direction: ltr; text-align: left; }
  .tools { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; font-size: 15px; }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  .empty { color: var(--muted); }
  @media print { .tools { display: none; } li { break-inside: avoid; } body { background: #fff; color: #000; } }
</style>
</head>
<body>
<div class="sheet" id="sheet">
  <header>
    <h1 id="title">Home exercise program</h1>
    <div class="sub" id="sub"></div>
  </header>
  <ol id="list"></ol>
  <div class="tools">
    <button type="button" id="print">Print</button>
    <label><input type="checkbox" id="show-en" checked> Show the English line under each exercise</label>
  </div>
</div>
<script>
"use strict";
// Fixed headings in the patient's language. Code wrote these and nobody on the team reads Arabic or
// Ukrainian: they are proposals until a native speaker checks them.
const CHROME = {
  ar: { dir: "rtl", title: "برنامج تمارينك المنزلية", by: "وصفه لك معالجك الفيزيائي", date: "التاريخ" },
  uk: { dir: "ltr", title: "Ваша програма домашніх вправ", by: "Призначено вашим фізіотерапевтом", date: "Дата" },
  en: { dir: "ltr", title: "Your home exercise program", by: "Prescribed by your physiotherapist", date: "Date" },
};
function decode(hash) {
  const b64 = hash.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "===".slice((b64.length + 3) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
}
let program = null;
try { program = decode(location.hash.slice(1)); } catch (e) { program = null; }
const list = document.getElementById("list");
if (!program || !program.lines || !program.lines.length) {
  list.replaceWith(Object.assign(document.createElement("p"), { className: "empty", textContent: "No approved program was given to this page." }));
} else {
  const c = CHROME[program.language] || CHROME.en;
  document.documentElement.lang = program.language;
  document.getElementById("sheet").dir = c.dir;
  document.getElementById("title").textContent = c.title;
  document.title = c.title;
  document.getElementById("sub").textContent = `${c.by} · ${c.date} ${program.date} · ${CHROME.en.title}`;
  for (const line of program.lines) {
    const li = document.createElement("li");
    const t = document.createElement("div"); t.className = "text"; t.lang = program.language; t.textContent = line.text;
    const en = document.createElement("div"); en.className = "en"; en.lang = "en"; en.textContent = line.en;
    li.append(t, en); list.append(li);
  }
}
document.getElementById("print").addEventListener("click", () => window.print());
document.getElementById("show-en").addEventListener("change", (e) => {
  document.querySelectorAll(".en").forEach((n) => { n.hidden = !e.target.checked; });
});
</script>
</body>
</html>
