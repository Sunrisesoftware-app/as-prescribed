<!doctype html>
<!-- The recording stage (scripts/video/stage.py): the desk at 1400 px on the left, the box's GPUs on the right. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>As Prescribed: recording stage</title>
<style>
  :root { --bg: #0F2B26; --ink: #F4F6F2; --soft: #A9C7BF; --accent: #7FD1C3; --track: #1D3F38; --line: #2A4E46;
          --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f2f5f3; }
  body { display: grid; grid-template-columns: 1400px 520px; font-family: var(--sans); }
  iframe { width: 1400px; height: 1080px; border: 0; background: #f2f5f3; }
  aside { background: var(--bg); color: var(--ink); padding: 40px 32px; display: flex; flex-direction: column; gap: 28px; }
  .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 30px; line-height: 1.25; font-weight: 600; margin-top: 8px; }
  .sub { font-size: 18px; color: var(--soft); margin-top: 6px; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; display: grid; gap: 10px; }
  .name { font-size: 24px; font-weight: 600; }
  .role { font-size: 18px; color: var(--soft); }
  .row { display: flex; align-items: baseline; justify-content: space-between; }
  .use { font-size: 64px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .use small { font-size: 26px; font-weight: 600; color: var(--soft); margin-left: 4px; }
  .facts { font-size: 18px; color: var(--soft); text-align: right; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s ease; }
  svg { width: 100%; height: 70px; display: block; }
  .foot { margin-top: auto; font-size: 16px; color: var(--soft); display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #5d7a72; }
  .dot.on { background: var(--accent); box-shadow: 0 0 0 4px rgba(127, 209, 195, .18); }
</style>
</head>
<body>
<iframe id="app" src="{{APP}}" title="As Prescribed desk"></iframe>
<aside>
  <div>
    <p class="eyebrow">In the clinic</p>
    <h1>The clinic’s own AMD Radeon GPUs</h1>
    <p class="sub">llama.cpp with ROCm · patient data stays here</p>
  </div>
  <div id="cards"></div>
  <p class="foot"><span class="dot" id="dot"></span><span id="status">connecting to rocm-smi…</span></p>
</aside>
<script>
"use strict";
const cards = document.getElementById("cards");
cards.style.cssText = "display:grid;gap:20px";

function spark(history) {
  const w = 456, h = 70, n = 60;
  const pts = history.slice(-n).map((s, i, a) => [((n - a.length + i) / (n - 1)) * w, h - 4 - (s.use / 100) * (h - 8)]);
  if (!pts.length) return `<svg viewBox="0 0 ${w} ${h}"></svg>`;
  const line = pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ");
  const area = `${pts[0][0].toFixed(1)},${h} ${line} ${pts[pts.length - 1][0].toFixed(1)},${h}`;
  return `<svg viewBox="0 0 ${w} ${h}" aria-label="GPU use, last minute"><rect width="${w}" height="${h}" rx="8" fill="#14352f"/>`
    + `<polygon points="${area}" fill="rgba(127,209,195,.22)"/><polyline points="${line}" fill="none" stroke="#7FD1C3" stroke-width="2.5"/></svg>`;
}

async function tick() {
  try {
    const d = await (await fetch("/gpu", { cache: "no-store" })).json();
    cards.innerHTML = d.cards.map((c) => {
      const last = c.history[c.history.length - 1] || { use: 0, vram: 0, power: 0 };
      return `<div class="card"><div><p class="name">${c.name}</p><p class="role">${c.role} · ${c.model}</p></div>`
        + `<div class="row"><p class="use">${Math.round(last.use)}<small>% use</small></p>`
        + `<p class="facts">VRAM ${Math.round(last.vram)} %<br>${Math.round(last.power)} W</p></div>`
        + `<div class="bar"><i style="width:${last.use}%"></i></div>${spark(c.history)}</div>`;
    }).join("");
    const fresh = Date.now() / 1000 - d.at < 5;
    document.getElementById("dot").className = "dot" + (fresh ? " on" : "");
    document.getElementById("status").textContent = d.source === "fake" ? "simulated readings (stage test)"
      : fresh ? "live from rocm-smi, once a second" : "waiting for rocm-smi…";
  } catch (e) { /* the next tick tries again */ }
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
